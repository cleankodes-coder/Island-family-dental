  <rect x="50" y="40" width="100" height="120" rx="4" fill="#204270"/>
  <!-- Digital Tooth Silhouette in X-ray view -->
  <path d="M100 60C88 60 78 68 78 80C78 92 84 104 88 116C91 125 94 130 96 130C98 130 99 123 100 117C101 123 102 130 104 130C106 130 109 125 112 116C116 104 122 92 122 80C122 68 112 60 100 60Z" fill="#7DAED6" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Sensor Beam Indicator -->
  <line x1="60" y1="75" x2="140" y2="75" stroke="#7DAED6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="60" y1="105" x2="140" y2="105" stroke="#7DAED6" stroke-width="1.5" stroke-dasharray="4 4"/>
