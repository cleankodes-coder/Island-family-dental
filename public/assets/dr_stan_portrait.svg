<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="dr_bg" x1="0" y1="0" x2="400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162C54" />
      <stop offset="100%" stop-color="#204270" />
    </linearGradient>
    <linearGradient id="dr_ring" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DAED6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="url(#dr_bg)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="200" cy="190" r="110" stroke="url(#dr_ring)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>
  <circle cx="200" cy="190" r="90" fill="#204270" stroke="#7DAED6" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Doctor Monogram & Stethoscope Emblem -->
  <text x="200" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">SG</text>
  <text x="200" y="215" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#7DAED6" text-anchor="middle" letter-spacing="1.5">DDS · NYU DENTISTRY</text>

  <!-- Physician Lab Coat Representation -->
  <path d="M110 370C110 300 150 270 200 270C250 270 290 300 290 370V440H110V370Z" fill="#FAF8F4" fill-opacity="0.12"/>
  <path d="M170 270L190 330H210L230 270" stroke="#7DAED6" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Caduceus / Tooth Motif -->
  <path d="M200 345C193 345 188 350 188 357C188 363 192 371 195 377C198 382 200 384 200 384C200 384 202 382 205 377C208 371 212 363 212 357C212 350 207 345 200 345Z" fill="#7DAED6"/>
  
  <!-- Verification Label -->
  <rect x="50" y="410" width="300" height="42" rx="8" fill="#162C54" stroke="#7DAED6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="200" y="436" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">DR. STANISLAV GOLYAND, DDS</text>
</svg>
